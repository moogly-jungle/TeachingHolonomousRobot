[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "holorobot"
version = "0.1.0"
description = "Bibliothèque Python du robot holonome d'enseignement (dépôt TeachingHolonomousRobot)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial"]

[tool.setuptools]
packages = ["holorobot"]
